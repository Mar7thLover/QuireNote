name: Mobile
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/mobile/**", "apps/web/**", "packages/**"]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # 默认会装已下架的 "tools" 包，新版 cmdline-tools 找不到它就失败；只装需要的。
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @quirenote/mobile build
      - run: cd apps/mobile/android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: quirenote-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          # 私有仓库的产物共用账户存储额度，只留两周，避免堆满。
          retention-days: 14

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @quirenote/mobile build
      - name: Build for simulator (unsigned)
        run: |
          cd apps/mobile/ios/App
          xcodebuild -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
